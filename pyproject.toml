[project]
name = "nexus"
version = "0.1.0"
description = "AI-powered text-based RPG engine"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",
    "python-dotenv>=1.0.0",
    "mysql-connector-python>=9.3.0",
    "flask>=3.1.1",
    "flask-cors>=6.0.1",
    "gradio>=5.32.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-languages>=1.10.2",
    "tree-sitter-python>=0.23.6",
    "mcp>=2.1.1",
    "uvicorn>=0.52.4",
    "starlette>=1.6.0",
    "asgiref>=3.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.10.0",
    "black>=23.7.0",
]
